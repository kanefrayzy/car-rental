; A booking request carries two documents of up to 10 MB each.
upload_max_filesize = 12M
post_max_size = 26M
max_file_uploads = 4
memory_limit = 256M

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside a built image, so skip the per-request file checks.
opcache.validate_timestamps = 0
